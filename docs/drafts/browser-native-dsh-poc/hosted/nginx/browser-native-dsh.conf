# TLS reverse proxy for hosted browser-native DSH.
#
# Terminate TLS here and forward to the backend over the container network. The
# backend must be started with DSH_POC_PUBLIC_ORIGIN set to the same https
# origin, because it admits that forwarded Host and Origin and marks the local
# auth cookie Secure only for a configured https public origin.
#
#   proxy_set_header Host $http_host
#
# forwards the external host (and any non-default port) unchanged, which is what
# the backend compares against DSH_POC_PUBLIC_ORIGIN.

upstream browser_native_dsh {
    server backend:4185;
}

server {
    listen 80;
    server_name _;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Attachment uploads are capped at 64 MiB by the backend.
    client_max_body_size 68m;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "";
    # Session event streaming must not be buffered or cut at 60 seconds.
    proxy_buffering off;
    proxy_read_timeout 300s;

    location / {
        proxy_pass http://browser_native_dsh;
    }
}
