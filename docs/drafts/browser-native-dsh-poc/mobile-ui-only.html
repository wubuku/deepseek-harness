<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DSH mobile · UI only</title>
<style>
  :root { color-scheme: light dark; --fg: #111; --muted: #5c6370; --bg: #fff; --line: #d7dbe0; --accent: #2f6fed; --accent-fg: #fff; --error: #b3261e; }
  @media (prefers-color-scheme: dark) { :root { --fg: #eceff4; --muted: #9aa3af; --bg: #14171c; --line: #2b313a; --accent: #7aa2ff; --accent-fg: #0b1020; --error: #ff9a8a; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  header { position: sticky; top: 0; padding: 14px calc(16px + env(safe-area-inset-left)) 12px; border-bottom: 1px solid var(--line); background: var(--bg); }
  h1 { margin: 0; font-size: 17px; font-weight: 650; }
  .capability { margin-top: 4px; color: var(--muted); font-size: 12px; }
  main { padding: 16px calc(16px + env(safe-area-inset-left)) 120px; }
  .entry { margin: 0 0 14px; padding: 12px; border: 1px solid var(--line); border-radius: 12px; white-space: pre-wrap; word-break: break-word; }
  .entry.user { border-color: var(--accent); }
  .entry .role { display: block; margin-bottom: 6px; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; }
  form { position: fixed; left: 0; right: 0; bottom: 0; display: flex; gap: 8px; padding: 10px calc(12px + env(safe-area-inset-left)) calc(10px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); background: var(--bg); }
  textarea { flex: 1; min-height: 44px; max-height: 120px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: transparent; color: inherit; font: inherit; resize: none; }
  button { min-width: 72px; padding: 0 16px; border: 0; border-radius: 10px; background: var(--accent); color: var(--accent-fg); font: inherit; font-weight: 600; }
  button:disabled { opacity: 0.5; }
  .status { min-height: 1.5em; margin-top: 10px; color: var(--muted); font-size: 13px; }
  .status.error { color: var(--error); }
  .approval { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 0 0 14px; padding: 12px; border: 1px solid var(--accent); border-radius: 12px; }
  .approval .label { flex: 1 1 100%; font-size: 14px; }
  .approval button.reject { background: transparent; border: 1px solid var(--line); color: inherit; }
</style>
</head>
<body>
<header>
  <h1>DSH mobile · server-host execution</h1>
  <div class="capability" data-mobile-storage>probing browser storage</div>
</header>
<main data-mobile-transcript></main>
<div class="status" data-mobile-status aria-live="polite">ready</div>
<form data-mobile-form>
  <textarea data-mobile-input rows="1" placeholder="Ask the server-hosted agent" aria-label="Prompt"></textarea>
  <button data-mobile-send type="submit">Send</button>
</form>
<script>
window.__DSH_MOBILE_UI_ONLY__ = true
window.__DSH_WORKER_REQUESTS__ = 0
const NativeWorker = window.Worker
window.Worker = function (...args) {
  window.__DSH_WORKER_REQUESTS__ += 1
  return new NativeWorker(...args)
}

const params = new URLSearchParams(location.search)
const sessionId = params.get('sessionId') ?? `mobile-${crypto.randomUUID()}`
const transcript = document.querySelector('[data-mobile-transcript]')
const statusLine = document.querySelector('[data-mobile-status]')
const storageLine = document.querySelector('[data-mobile-storage]')
const form = document.querySelector('[data-mobile-form]')
const input = document.querySelector('[data-mobile-input]')
const send = document.querySelector('[data-mobile-send]')
const zh = (navigator.language ?? 'en').toLowerCase().startsWith('zh')
const copy = zh ? {
  title: 'DSH 移动端 · 仅 UI',
  heading: 'DSH 移动端 · 服务端执行',
  probing: '正在探测浏览器存储',
  opfsUnused: 'OPFS 可用但未使用 · 不使用 Worker 存储',
  noOpfs: 'OPFS 不可用 · 仅使用服务端会话',
  placeholder: '向服务端 Agent 提问',
  promptLabel: '提示词',
  send: '发送',
  ready: '就绪',
  running: '服务端回合正在运行',
  completed: phase => `已完成 · ${phase}`,
  turnReason: reason => reason === 'completed' ? '回合已完成' : reason === 'aborted' ? '回合已中止' : `回合${reason}`,
  incomplete: '回合结束但未完成',
  refused: status => `服务端拒绝了该回合（${status}）`,
  streamFailed: status => `服务端流读取失败（${status}）`,
  approvalNeeded: name => `需要审批：${name}`,
  approve: '批准',
  reject: '拒绝',
  decisionFailed: status => `审批提交失败（${status}）`,
  roles: { user: '用户', 'server user': '服务端用户', assistant: '助手', tool: '工具', 'tool result': '工具结果' },
} : {
  title: 'DSH mobile · UI only',
  heading: 'DSH mobile · server-host execution',
  probing: 'probing browser storage',
  opfsUnused: 'OPFS API present but unused · no Worker storage',
  noOpfs: 'OPFS unavailable · server-side Session only',
  placeholder: 'Ask the server-hosted agent',
  promptLabel: 'Prompt',
  send: 'Send',
  ready: 'ready',
  running: 'server host running',
  completed: phase => `completed · ${phase}`,
  turnReason: reason => `turn ${reason}`,
  incomplete: 'turn settled without completion',
  refused: status => `server host refused the turn (${status})`,
  streamFailed: status => `server host stream failed (${status})`,
  approvalNeeded: name => `Approval needed: ${name}`,
  approve: 'Approve',
  reject: 'Reject',
  decisionFailed: status => `approval decision failed (${status})`,
  roles: { user: 'user', 'server user': 'server user', assistant: 'assistant', tool: 'tool', 'tool result': 'tool result' },
}
document.documentElement.lang = zh ? 'zh-CN' : 'en'
document.title = copy.title
document.querySelector('h1').textContent = copy.heading
storageLine.textContent = copy.probing
input.placeholder = copy.placeholder
input.setAttribute('aria-label', copy.promptLabel)
send.textContent = copy.send
statusLine.textContent = copy.ready

storageLine.textContent = navigator.storage && navigator.storage.getDirectory
  ? copy.opfsUnused
  : copy.noOpfs

function setStatus(text, error = false) {
  statusLine.textContent = text
  statusLine.classList.toggle('error', error)
}

function appendEntry(role, text) {
  if (text.length === 0) return
  const entry = document.createElement('div')
  entry.className = `entry ${role}`
  entry.dataset.mobileRole = role
  const label = document.createElement('span')
  label.className = 'role'
  label.textContent = copy.roles[role] ?? role
  entry.append(label, document.createTextNode(text))
  transcript.append(entry)
}

function eventText(event) {
  const content = event.data?.content ?? event.data?.message?.content
  if (typeof content === 'string') return content
  if (!Array.isArray(content)) return ''
  return content.filter(block => block && block.type === 'text' && typeof block.text === 'string')
    .map(block => block.text).join('')
}

async function readStream(response, onItem) {
  const reader = response.body.getReader()
  const decoder = new TextDecoder()
  let buffer = ''
  while (true) {
    const part = await reader.read()
    buffer += decoder.decode(part.value ?? new Uint8Array(), { stream: !part.done })
    let newline = buffer.indexOf('\n')
    while (newline >= 0) {
      const line = buffer.slice(0, newline).trim()
      buffer = buffer.slice(newline + 1)
      if (line.length > 0) onItem(JSON.parse(line))
      newline = buffer.indexOf('\n')
    }
    if (part.done) break
  }
  const tail = buffer.trim()
  if (tail.length > 0) onItem(JSON.parse(tail))
}

function clearApproval() {
  document.querySelector('[data-mobile-approval]')?.remove()
}

async function decideApproval(turnId, approvalId, decision) {
  const response = await fetch('/api/browser-native/session/durable/approve', {
    method: 'POST',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify({
      protocolVersion: 1,
      requestId: crypto.randomUUID(),
      turnId,
      approvalId,
      decision,
    }),
  })
  if (!response.ok) {
    setStatus(copy.decisionFailed(response.status), true)
    return
  }
  clearApproval()
}

function renderApproval(turnId, approval) {
  clearApproval()
  const panel = document.createElement('div')
  panel.className = 'approval'
  panel.dataset.mobileApproval = approval.approvalId
  const label = document.createElement('span')
  label.className = 'label'
  label.textContent = copy.approvalNeeded(approval.name)
  const approve = document.createElement('button')
  approve.type = 'button'
  approve.dataset.mobileApprove = 'true'
  approve.textContent = copy.approve
  const reject = document.createElement('button')
  reject.type = 'button'
  reject.className = 'reject'
  reject.dataset.mobileReject = 'true'
  reject.textContent = copy.reject
  approve.addEventListener('click', () => void decideApproval(turnId, approval.approvalId, 'approve'))
  reject.addEventListener('click', () => void decideApproval(turnId, approval.approvalId, 'reject'))
  panel.append(label, approve, reject)
  transcript.append(panel)
}

form.addEventListener('submit', async event => {
  event.preventDefault()
  const prompt = input.value.trim()
  if (prompt.length === 0 || send.disabled) return
  appendEntry('user', prompt)
  input.value = ''
  send.disabled = true
  setStatus(copy.running)
  const turnId = `mobile-turn-${crypto.randomUUID()}`
  window.__DSH_LAST_TURN_ID__ = turnId
  let completed = false
  const pollApproval = async () => {
    if (completed) return
    const status = await fetch(`/api/browser-native/session/durable?turnId=${encodeURIComponent(turnId)}`)
    if (!status.ok) return
    const current = await status.json()
    if (current.pendingApproval === undefined) {
      clearApproval()
      return
    }
    if (document.querySelector(`[data-mobile-approval="${current.pendingApproval.approvalId}"]`) !== null) return
    renderApproval(turnId, current.pendingApproval)
  }
  const approvalTimer = setInterval(() => void pollApproval(), 400)
  void pollApproval()
  try {
    const started = await fetch('/api/browser-native/session/durable', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({
        protocolVersion: 1,
        requestId: crypto.randomUUID(),
        sessionId,
        turnId,
        prompt,
      }),
    })
    if (!started.ok) throw new Error(copy.refused(started.status))
    const stream = await fetch(`/api/browser-native/session/durable/stream?turnId=${encodeURIComponent(turnId)}&fromSeq=0`)
    if (!stream.ok) throw new Error(copy.streamFailed(stream.status))
    await readStream(stream, item => {
      if (item.kind === 'settled') {
        completed = true
        setStatus(copy.completed(item.phase ?? 'settled'))
        return
      }
      if (item.kind !== 'event') return
      const entry = item
      if (entry.type === 'user/message') {
        appendEntry('server user', eventText(entry))
        return
      }
      if (entry.type === 'assistant/message') appendEntry('assistant', eventText(entry))
      if (entry.type === 'tool/call') appendEntry('tool', `${entry.data?.name ?? 'tool'} ${entry.data?.arguments ?? ''}`)
      if (entry.type === 'tool/result') appendEntry('tool result', eventText(entry))
      if (entry.type === 'turn/end') {
        const reason = entry.data?.reason?.kind ?? 'completed'
        completed = reason === 'completed'
        setStatus(copy.turnReason(reason))
      }
    })
    if (!completed) setStatus(copy.incomplete, true)
  } catch (error) {
    console.error(error)
    setStatus(String(error?.message ?? error), true)
  } finally {
    clearInterval(approvalTimer)
    clearApproval()
    send.disabled = false
    input.focus()
  }
})
</script>
</body>
</html>
